<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TubePredict</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { width: 360px; padding: 16px; background: #0f0f0f; color: #f1f1f1; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid #272727; padding-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #fff; }
    .brand-icon { width: 22px; height: 22px; background: #ff0033; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
    .version-tag { font-size: 10px; color: #888; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; border: 1px solid #333; }
    
    label { font-size: 11px; font-weight: 600; color: #aaa; margin-top: 10px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 8px 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #333; background: #1f1f1f; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: #ff0033; }
    .row { display: flex; gap: 8px; }
    .col { flex: 1; }
    
    button { width: 100%; padding: 10px; margin-top: 16px; background: #ff0033; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; transition: background 0.2s; }
    button:hover { background: #cc0029; }
    button:disabled { background: #444; cursor: not-allowed; }
    
    #resultBox { margin-top: 14px; padding: 12px; border-radius: 6px; background: #1a1a1a; border: 1px solid #2a2a2a; display: none; }
    .score-badge { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
    .high { color: #00e676; }
    .moderate { color: #ffab00; }
    .low { color: #ff5252; }
    .tier-desc { font-size: 12px; margin-bottom: 10px; color: #ddd; }
    .tips-title { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 700; margin-bottom: 6px; }
    ul { font-size: 11px; color: #bbb; padding-left: 18px; line-height: 1.5; }
    li { margin-bottom: 4px; }
    
    .footer { font-size: 10px; color: #666; margin-top: 14px; text-align: center; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222; padding-top: 8px; }
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #00e676; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">▶</div>
      <span>TubePredict</span>
    </div>
    <span class="version-tag">v1.0.0</span>
  </div>

  <label for="titleInput">Planned Video Title</label>
  <input type="text" id="titleInput" placeholder="e.g. 10 AI Tools You MUST Try in 2026">

  <div class="row">
    <div class="col">
      <label for="duration">Duration (mins)</label>
      <input type="number" id="duration" value="12" min="1" max="300">
    </div>
    <div class="col">
      <label for="tagsCount">Tags Count</label>
      <input type="number" id="tagsCount" value="15" min="0" max="50">
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label for="hour">Publish Hour (24h)</label>
      <input type="number" id="hour" value="18" min="0" max="23">
    </div>
    <div class="col">
      <label for="day">Day of Week</label>
      <select id="day">
        <option value="0">Monday</option>
        <option value="1">Tuesday</option>
        <option value="2">Wednesday</option>
        <option value="3">Thursday</option>
        <option value="4" selected>Friday</option>
        <option value="5">Saturday</option>
        <option value="6">Sunday</option>
      </select>
    </div>
  </div>

  <button id="analyzeBtn">Predict Potential</button>

  <div id="resultBox">
    <div id="scoreBadge" class="score-badge">--</div>
    <div id="tierDesc" class="tier-desc"></div>
    <div class="tips-title">Actionable Optimizations</div>
    <ul id="tipsList"></ul>
  </div>

  <div class="footer">
    <div><span class="status-dot"></span><span id="endpointLabel">localhost:8000</span></div>
    <span>YouTube Creator AI</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
